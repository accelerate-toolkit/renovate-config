name: Dependency updates

on:
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:
    inputs:
      dry-run:
        description: Preview updates without creating branches, PRs or merges
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check Renovate credential
        env:
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
        run: |
          test -n "$RENOVATE_TOKEN" || { echo 'Configure a repository-scoped GitHub-only RENOVATE_TOKEN secret.' >&2; exit 1; }
      - uses: renovatebot/github-action@acdd6bda8b035c99ce59d5675816af2aa65a1774 # v46.3.14
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
          renovate-version: 44.242.0
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_AUTODISCOVER: "false"
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: required
          RENOVATE_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run && 'full' || '' }}
          LOG_LEVEL: info
